databases:
  - name: socializaciones-db
    plan: free
    region: oregon

services:
  - type: web
    name: socializaciones-meraki
    env: docker
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: APP_NAME
        value: "MERAKI Capacitaciones"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: "https://socializaciones.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: socializaciones-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
