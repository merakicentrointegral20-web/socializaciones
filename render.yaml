services:
  - type: web
    name: socializaciones-meraki
    env: docker
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: APP_NAME
        value: "MERAKI Capacitaciones"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
